name: Build Font Studio for Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller
      - name: Install UPX
        run: choco install upx -y --no-progress
      - name: Compile check
        run: python -m py_compile font_studio.py
      - name: Verify icon file
        run: |
          pwd
          git branch --show-current
          git ls-files assets
          if (Test-Path "assets/fontstudio.ico") {
            Write-Host "ICON FOUND"
          } else {
            Write-Host "ICON MISSING"
            Get-ChildItem -Force
            Get-ChildItem assets -Force
            exit 1
          }
      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean packaging/fontstudio.spec
          "FontStudio.exe size: {0:N1} MB" -f ((Get-Item dist/FontStudio.exe).Length / 1MB)
      - name: Publish EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Font Studio build ${{ github.run_number }}
          body: |
            Automated Windows x64 build of Font Studio.
            Download FontStudio.exe below.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/FontStudio.exe

      # Keep a stable download URL pointing to the newest successful manual build.
      # Historical build-N releases remain unchanged.
      - name: Update rolling latest EXE release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Font Studio latest
          body: |
            Rolling download for the newest successful manual Windows x64 build.
            Direct download: https://github.com/${{ github.repository }}/releases/download/latest/FontStudio.exe
            Historical builds remain available under their build-N tags.
          prerelease: true
          make_latest: false
          files: dist/FontStudio.exe
