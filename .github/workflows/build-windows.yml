name: Build Font Studio for Windows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller
      - name: Install UPX
        run: choco install upx --yes --no-progress
      - name: Verify UPX
        run: upx --version
      - name: Configure ASCII-only PyInstaller cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\font-studio\build\pyi-cache" | Out-Null
          "PYINSTALLER_CONFIG_DIR=C:\font-studio\build\pyi-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile check
        run: python -m py_compile font_studio.py
      - name: Verify icon file
        run: |
          pwd
          git branch --show-current
          git ls-files assets
          if (Test-Path "assets/fontstudio.ico") {
            Write-Host "ICON FOUND"
          } else {
            Write-Host "ICON MISSING"
            Get-ChildItem -Force
            Get-ChildItem assets -Force
            exit 1
          }
      - name: Build compact EXE
        run: pyinstaller --noconfirm --clean packaging/fontstudio.spec
      - name: Report EXE size
        shell: pwsh
        run: |
          $exe = Get-Item "dist/FontStudio.exe"
          Write-Host ("FontStudio.exe size: {0:N2} MiB ({1:N0} bytes)" -f ($exe.Length / 1MB), $exe.Length)
      - name: Publish EXE to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Font Studio build ${{ github.run_number }}
          body: |
            Automated Windows x64 build of Font Studio.
            Download FontStudio.exe below.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/FontStudio.exe

      # Keep a stable download URL pointing to the newest successful manual build.
      # Historical build-N releases remain unchanged.
      # Only builds selected from main may update the permanent download URL.
      - name: Update rolling latest EXE release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Font Studio latest
          body: |
            Rolling download for the newest successful manual Windows x64 build.
            Direct download: https://github.com/${{ github.repository }}/releases/download/latest/FontStudio.exe
            Historical builds remain available under their build-N tags.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/FontStudio.exe
