name: Build Font Studio for Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller
      - name: Compile check
        run: python -m py_compile font_studio.py
      - name: Verify icon file
        run: |
          pwd
          git branch --show-current
          git ls-files assets
          if (Test-Path "assets/fontstudio.ico") {
            Write-Host "ICON FOUND"
          } else {
            Write-Host "ICON MISSING"
            Get-ChildItem -Force
            Get-ChildItem assets -Force
            exit 1
          }
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name FontStudio --icon assets/fontstudio.ico --add-data "assets/fontstudio.ico;assets" --collect-all PySide6 --collect-all fontTools font_studio.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FontStudio-Windows-x64
          path: dist/FontStudio.exe
          if-no-files-found: error
          retention-days: 30
